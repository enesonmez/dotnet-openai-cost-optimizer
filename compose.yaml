services:
  # Redis: Önbellekleme için
  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - ai-network
  
  # .NET API
  dotnetopenaicostoptimizer.api:
    build:
      context: .
      dockerfile: DotNetOpenAICostOptimizer.Api/Dockerfile
    container_name: dotnet-openai-api
    ports:
      - "5140:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis-cache:6379
    depends_on:
      - redis-cache
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge